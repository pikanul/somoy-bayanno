<!doctype html>
<html lang="bn">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#067A3B">
        <title>অফলাইন - The Daily Somoy Bayanno</title>
        <style>
            body {
                margin: 0;
                background: #f7f7f7;
                color: #171717;
                font-family: ui-sans-serif, system-ui, sans-serif;
            }

            main {
                box-sizing: border-box;
                min-height: 100vh;
                width: min(100% - 1.5rem, 40rem);
                margin: 0 auto;
                display: grid;
                place-content: center;
                gap: 1rem;
            }

            h1 {
                margin: 0;
                color: #067a3b;
                font-size: clamp(1.8rem, 7vw, 3rem);
                line-height: 1.2;
            }

            p {
                margin: 0;
                font-size: 1rem;
                line-height: 1.8;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>আপনি এখন অফলাইনে আছেন</h1>
            <p>সংযোগ ফিরে এলে সর্বশেষ সংবাদ আবার লোড করুন। ব্রেকিং নিউজ অফলাইনে সংরক্ষণ করা হয় না।</p>
        </main>
    </body>
</html>
